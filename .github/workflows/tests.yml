name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  tests:
    runs-on: ubuntu-latest

    # Every combination below was resolved with `composer update --dry-run`
    # before being committed, so a red leg here means a real regression rather
    # than a matrix that never worked.
    #
    # Laravel 11 is deliberately absent: composer.json no longer supports it.
    # Every laravel/framework v11.x release is blocked by security advisories,
    # so Composer refuses to install the line at all under default policy.
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['^12.0', '^13.0']
        stability: [prefer-lowest, prefer-stable]
        exclude:
          # Laravel 13 requires PHP 8.3+.
          - php: '8.2'
            laravel: '^13.0'

    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · ${{ matrix.stability }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_sqlite, sqlite3, intl, fileinfo
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Run tests
        run: vendor/bin/pest --colors=always

  static:
    runs-on: ubuntu-latest
    name: Style and static analysis

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - run: composer install --prefer-dist --no-interaction

      # Check, never fix. Auto-committing style fixes onto a contributor's
      # branch rewrites their work without asking.
      - run: vendor/bin/pint --test

      - run: vendor/bin/phpstan analyse --no-progress
