<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    background: radial-gradient(1200px 700px at 78% 22%, #0F3D3A 0%, #082826 55%, #020E0D 100%);
    color: #fff; overflow: hidden; position: relative;
  }
  .wrap { display: flex; height: 100%; align-items: center; padding: 0 92px; gap: 64px; }
  .copy { max-width: 700px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 22px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    color: #99F6E4; margin-bottom: 26px;
  }
  .eyebrow .dot { width: 12px; height: 12px; border-radius: 50%; background: #2DD4BF; box-shadow: 0 0 18px #2DD4BF; }
  /* 64px rather than the usual 78px: "Identity Contracts" is the longest name in
     the suite and overruns the copy column at 78. */
  h1 { font-size: 64px; line-height: 1.06; font-weight: 800; letter-spacing: -.02em; }
  h1 .accent { background: linear-gradient(90deg,#5EEAD4,#2DD4BF); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p.sub { margin-top: 28px; font-size: 30px; line-height: 1.35; color: #CBD5E1; font-weight: 400; }
  .badges { margin-top: 40px; display: flex; gap: 14px; }
  .badge { font-size: 22px; font-weight: 600; padding: 12px 22px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); color: #CCFBF1; white-space: nowrap; }
  .art { flex: 1; display: flex; align-items: center; justify-content: center; }
  .glyph { width: 360px; height: 360px; filter: drop-shadow(0 30px 60px rgba(0,0,0,.45)); }
  .corner { position: absolute; right: -120px; bottom: -160px; width: 520px; height: 520px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(45,212,191,.28), transparent 60%); }
</style>
</head>
<body>
  <div class="corner"></div>
  <div class="wrap">
    <div class="copy">
      <span class="eyebrow"><span class="dot"></span>Statamic Addon</span>
      <h1>Statamic<br><span class="accent">Identity Contracts</span></h1>
      <p class="sub">One stable answer to &ldquo;who did this?&rdquo;, so no addon in the suite ever reaches for your User model.</p>
      <div class="badges">
        <span class="badge">Actor resolution</span>
        <span class="badge">No User model</span>
        <span class="badge">Laravel only</span>
      </div>
    </div>
    <div class="art">
      <svg class="glyph" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
            <stop stop-color="#2DD4BF"/><stop offset="1" stop-color="#0D9488"/>
          </linearGradient>
          <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#042F2E" flood-opacity="0.32"/>
          </filter>
        </defs>
        <rect width="512" height="512" rx="112" fill="url(#bg)"/>
        <!-- the lanyard clip: the badge is carried, not filed -->
        <rect x="228" y="84" width="56" height="30" rx="15" fill="#FFFFFF" opacity="0.5"/>
        <!-- the badge -->
        <g filter="url(#sh)">
          <rect x="136" y="124" width="240" height="288" rx="36" fill="#FFFFFF"/>
        </g>
        <circle cx="256" cy="162" r="15" fill="url(#bg)"/>
        <!-- the actor -->
        <circle cx="256" cy="234" r="38" fill="url(#bg)"/>
        <path d="M204 322 C 204 292 227 274 256 274 C 285 274 308 292 308 322 Z" fill="url(#bg)"/>
        <rect x="176" y="344" width="140" height="16" rx="8" fill="url(#bg)" opacity="0.45"/>
        <!-- the contract: the answer is signed, and the same every time -->
        <circle cx="378" cy="382" r="48" fill="#FFFFFF"/>
        <path d="M356 382 L372 399 L402 366" stroke="url(#bg)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
    </div>
  </div>
</body>
</html>
